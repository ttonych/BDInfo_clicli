name: Build (BDInfo_clicli)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]    # пуш тега v1.2.3 создаст релиз
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BDInfo.sln

      - name: Build Release
        run: msbuild BDInfo.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      # Собираем результаты сборки в dist/ без путей bin/Release
      - name: Stage build outputs to dist/
        shell: pwsh
        run: |
          $dist = "dist"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Ищем все папки .../bin/Release и копируем их содержимое в dist/<ИмяПроекта>
          $releaseDirs = Get-ChildItem -Path . -Recurse -Directory |
            Where-Object {
              $_.FullName -match '[\\/]bin[\\/]Release$'
            }

          foreach ($dir in $releaseDirs) {
            $projectDir = Split-Path (Split-Path $dir.FullName -Parent) -Leaf
            $target = Join-Path $dist $projectDir
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path (Join-Path $dir.FullName '*') -Destination $target -Recurse -Force
          }

          Write-Host "Staged to $dist:"
          Get-ChildItem $dist -Recurse | ForEach-Object { $_.FullName }

      # Упаковываем всю dist/ в один ZIP
      - name: Package ZIP
        shell: pwsh
        run: |
          $dist = "dist"
          $zipPath = "BDInfo-Release.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$dist/*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Created $zipPath"

      # Загружаем как артефакты: ZIP и распакованные файлы
      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: BDInfo-Release-zip
          path: BDInfo-Release.zip
          if-no-files-found: error

      - name: Upload artifact (files)
        uses: actions/upload-artifact@v4
        with:
          name: BDInfo-Release-files
          path: dist/**
          if-no-files-found: error

      # Релиз по тегу — прикрепляем только ZIP
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BDInfo-Release.zip
