name: Build (BDInfo_clicli)

on:
  push:
    branches: [ "UHD_Support" ]
    tags: [ "v*.*.*" ]    # pushing a tag like v1.2.3 will create/update a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Put MSBuild into PATH (for .NET Framework builds).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # nuget.exe restore also supports this project's PackageReference dependencies.
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore BDInfo.sln

      # Build directly to dist/ using MSBuild OutDir to avoid /bin/ in outputs.
      - name: Build to dist/
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # OutDir must be an absolute path and should end with a backslash
          $out = (Resolve-Path $dist).Path + "\"
          & msbuild BDInfo.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="$out" /m
          Write-Host "Built to ${out}"

      - name: Smoke test CLI entrypoint
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\BDInfo.exe"
          if (!(Test-Path $exe)) {
            throw "BDInfo.exe was not built at $exe"
          }

          $help = & $exe --help
          $exitCode = $LASTEXITCODE
          $help | Write-Host

          if ($exitCode -ne 0) {
            throw "BDInfo.exe --help exited with code $exitCode"
          }

          if (($help -join "`n") -notmatch "Options:") {
            throw "BDInfo.exe --help output did not contain the expected Options section"
          }

      - name: Smoke test report round-trip
        shell: pwsh
        run: .\scripts\smoke-report-roundtrip.ps1 -BuildOutputPath .\dist

      - name: Smoke test HDR10+ carryover reset
        shell: pwsh
        run: .\scripts\smoke-hdr10plus-carryover.ps1 -BuildOutputPath .\dist

      - name: Verify build output
        shell: pwsh
        run: |
          $required = @(
            "BDInfo.exe",
            "BDInfo.exe.config",
            "DiscUtils.dll",
            "ZedGraph.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path "dist" $file
            if (!(Test-Path $path)) {
              throw "Required build output is missing: $path"
            }
          }

      # Package everything from dist/ into a single ZIP at repository root.
      - name: Package ZIP for Release
        shell: pwsh
        run: |
          $zipPath = "BDInfo_clicli.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist/*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Created $zipPath"

      # Upload only one artifact with simplified paths (no /bin/ in structure).
      - name: Upload artifact (files only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: BDInfo_clicli
          path: dist/**
          if-no-files-found: error

      # On tag pushes (v*.*.*), create/update a GitHub Release and attach the ZIP.
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            BDInfo_clicli.zip
